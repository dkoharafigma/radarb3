<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar B3</title>
    <!--
      Carbon is compiled with `$css--font-face: false`, so the app loads IBM Plex Sans itself.
      Carbon's own @font-face block points at `~@ibm/plex`, a webpack-style path Vite cannot
      resolve. 400 and 600 are the only weights the Web frames use.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
